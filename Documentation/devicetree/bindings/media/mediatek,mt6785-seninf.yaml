%YAML 1.2
---
$id: http://devicetree.org/schemas/media/mediatek,mt6785-seninf.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: MediaTek MT6785 Sensor Interface

maintainers:
  - masterxq <masterxq@users.noreply.github.com>

description:
  The MT6785 SENINF receives CSI-2 data from up to five sensors (CSI0, CSI1
  and CSI2 in 4-lane mode, or CSI0 split into CSI0A and CSI0B) and routes it
  through six MUXes and a CAM mux crossbar to the raw ISP (CAM A/B) and to
  the CAMSV DMA engines. It belongs to the newer SENINF generation with a
  separate CSI-2 receiver block per input; the analog D-PHYs are separate
  devices (mediatek,mt6785-csi-rx).

properties:
  compatible:
    const: mediatek,mt6785-seninf

  reg:
    maxItems: 1

  interrupts:
    maxItems: 1

  power-domains:
    maxItems: 1

  clocks:
    items:
      - description: camsys SENINF gate
      - description: topckgen SENINF mux
      - description: topckgen SENINF1 mux
      - description: topckgen SENINF2 mux

  clock-names:
    items:
      - const: camsys
      - const: top_mux
      - const: top_mux1
      - const: top_mux2

  phys:
    minItems: 1
    maxItems: 4
    description: D-PHYs of the connected inputs, named after the port

  phy-names:
    minItems: 1
    maxItems: 4
    items:
      enum: [ csi0, csi1, csi2, csi0b ]

  ports:
    $ref: /schemas/graph.yaml#/properties/ports

    patternProperties:
      "^port@[0-3]$":
        $ref: /schemas/graph.yaml#/$defs/port-base
        unevaluatedProperties: false
        description:
          CSI-2 inputs, port 0 CSI0 (SENINF1), 1 CSI1 (SENINF3), 2 CSI2
          (SENINF5), 3 CSI0B (SENINF2). An input has one endpoint per
          sensor. Sensors behind a board switch in front of the port share
          the input with one endpoint each (endpoint@0, endpoint@1), each
          with its own lane configuration; one of them streams at a time.

        patternProperties:
          "^endpoint(@[01])?$":
            $ref: video-interfaces.yaml#
            unevaluatedProperties: false

            properties:
              clock-lanes:
                maxItems: 1
              data-lanes:
                minItems: 1
                maxItems: 4

      "^port@[4-7]$":
        $ref: /schemas/graph.yaml#/properties/port
        description: outputs, MUX0..3 towards CAMSV1..4

required:
  - compatible
  - reg
  - clocks
  - clock-names
  - power-domains
  - ports

additionalProperties: false

examples:
  - |
    #include <dt-bindings/clock/mediatek,mt6785-clk.h>
    #include <dt-bindings/power/mediatek,mt6785-power.h>

    soc {
        #address-cells = <2>;
        #size-cells = <2>;

        seninf@1a040000 {
            compatible = "mediatek,mt6785-seninf";
            reg = <0 0x1a040000 0 0x8000>;
            clocks = <&camsys CLK_CAM_SENINF>,
                     <&topckgen CLK_TOP_SENINF0>,
                     <&topckgen CLK_TOP_SENINF1>,
                     <&topckgen CLK_TOP_SENINF2>;
            clock-names = "camsys", "top_mux", "top_mux1", "top_mux2";
            power-domains = <&spm MT6785_POWER_DOMAIN_CAM>;
            phys = <&csi1_rx>, <&csi0_rx>;
            phy-names = "csi1", "csi0";

            ports {
                #address-cells = <1>;
                #size-cells = <0>;

                /* two sensors behind a board switch */
                port@0 {
                    reg = <0>;
                    #address-cells = <1>;
                    #size-cells = <0>;

                    endpoint@0 {
                        reg = <0>;
                        data-lanes = <1 2>;
                        remote-endpoint = <&macro_out>;
                    };

                    endpoint@1 {
                        reg = <1>;
                        data-lanes = <1 2 3 4>;
                        remote-endpoint = <&wide_out>;
                    };
                };

                port@1 {
                    reg = <1>;
                    endpoint {
                        data-lanes = <1 2 3 4>;
                        remote-endpoint = <&sensor_out>;
                    };
                };

                port@4 {
                    reg = <4>;
                    endpoint {
                        remote-endpoint = <&camsv1_in>;
                    };
                };
            };
        };
    };
...
