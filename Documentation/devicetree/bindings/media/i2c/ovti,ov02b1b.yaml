%YAML 1.2
---
$id: http://devicetree.org/schemas/media/i2c/ovti,ov02b1b.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: OmniVision OV02B1B monochrome image sensor

maintainers:
  - masterxq <masterxq@users.noreply.github.com>

description: |
  The OmniVision OV02B1B is a 2 megapixel monochrome CMOS image sensor with a
  single lane MIPI CSI-2 output. It is controlled over I2C with 8-bit register
  addresses in pages selected by register 0xfd; the chip ID is in registers 0x02
  and 0x03 of page 0. The sensor is powered by an analog (AVDD) and an I/O
  (DOVDD) supply, an optional core supply (DVDD), and clocked by an external
  clock. The active low power-down line keeps it powered down.

allOf:
  - $ref: /schemas/media/video-interface-devices.yaml#

properties:
  compatible:
    const: ovti,ov02b1b

  reg:
    maxItems: 1

  clocks:
    description: External clock of the sensor.
    maxItems: 1

  avdd-supply:
    description: Analog supply, 2.8 V.

  dovdd-supply:
    description: Digital I/O supply, 1.8 V.

  dvdd-supply:
    description: Digital core supply, if not generated internally.

  powerdown-gpios:
    description: Power-down line, active low.
    maxItems: 1

  port:
    $ref: /schemas/graph.yaml#/$defs/port-base
    additionalProperties: false
    description: Output port, a single endpoint for the CSI-2 transmitter.

    properties:
      endpoint:
        $ref: /schemas/media/video-interfaces.yaml#
        unevaluatedProperties: false

        properties:
          data-lanes:
            maxItems: 1

          link-frequencies: true

required:
  - compatible
  - reg
  - clocks
  - avdd-supply
  - dovdd-supply

unevaluatedProperties: false

examples:
  - |
    #include <dt-bindings/gpio/gpio.h>

    i2c {
        #address-cells = <1>;
        #size-cells = <0>;

        camera@3d {
            compatible = "ovti,ov02b1b";
            reg = <0x3d>;
            clocks = <&camera_mclk>;
            avdd-supply = <&cam_avdd>;
            dovdd-supply = <&cam_dovdd>;
            powerdown-gpios = <&pio 197 GPIO_ACTIVE_LOW>;
            orientation = <1>;
        };
    };
...
