%YAML 1.2
---
$id: http://devicetree.org/schemas/media/i2c/ovti,ov64b40.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: OmniVision OV64B40 and OV16A1Q Quad Bayer image sensors

maintainers:
  - masterxq <masterxq@users.noreply.github.com>

description: |
  The OmniVision OV64B40 (64 megapixel) and OV16A1Q (16 megapixel) are Quad
  Bayer CMOS image sensors with a MIPI CSI-2 output of up to four data lanes.
  They are controlled over I2C with 16-bit register addresses and 8-bit values;
  the chip ID is in registers 0x300b and 0x300c. The sensor is powered by an
  analog (AVDD), an I/O (DOVDD) and a core (DVDD) supply and clocked by an
  external clock (XVCLK). The active low XSHUTDN line keeps it in reset.

allOf:
  - $ref: /schemas/media/video-interface-devices.yaml#

properties:
  compatible:
    enum:
      - ovti,ov16a1q
      - ovti,ov64b40

  reg:
    maxItems: 1

  clocks:
    description: XVCLK, the external clock of the sensor.
    maxItems: 1

  avdd-supply:
    description: Analog supply, 2.8 V.

  dovdd-supply:
    description: Digital I/O supply, 1.8 V.

  dvdd-supply:
    description: Digital core supply.

  reset-gpios:
    description: XSHUTDN line, active low.
    maxItems: 1

  port:
    $ref: /schemas/graph.yaml#/$defs/port-base
    additionalProperties: false
    description: Output port, a single endpoint for the CSI-2 transmitter.

    properties:
      endpoint:
        $ref: /schemas/media/video-interfaces.yaml#
        unevaluatedProperties: false

        properties:
          data-lanes:
            minItems: 1
            maxItems: 4

          link-frequencies: true

required:
  - compatible
  - reg
  - clocks
  - avdd-supply
  - dovdd-supply
  - dvdd-supply

unevaluatedProperties: false

examples:
  - |
    #include <dt-bindings/gpio/gpio.h>

    i2c {
        #address-cells = <1>;
        #size-cells = <0>;

        camera@22 {
            compatible = "ovti,ov64b40";
            reg = <0x22>;
            clocks = <&camera_mclk>;
            avdd-supply = <&cam_avdd>;
            dovdd-supply = <&cam_dovdd>;
            dvdd-supply = <&cam_dvdd>;
            reset-gpios = <&pio 124 GPIO_ACTIVE_LOW>;
            lens-focus = <&vcm>;
            orientation = <1>;
            rotation = <90>;

            port {
                endpoint {
                    data-lanes = <1 2 3 4>;
                    link-frequencies = /bits/ 64 <849600000>;
                    remote-endpoint = <&seninf_csi2_in>;
                };
            };
        };
    };
...
