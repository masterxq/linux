%YAML 1.2
---
$id: http://devicetree.org/schemas/leds/backlight/awinic,aw99703.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Awinic AW99703 3-channel WLED Backlight Driver

maintainers:
  - masterxq <masterxq@users.noreply.github.com>

description:
  I2C controlled boost converter with three WLED current sinks and 11-bit
  brightness. Boost, current and ramp settings are left to the bootloader
  and not described.

allOf:
  - $ref: common.yaml#

properties:
  compatible:
    const: awinic,aw99703

  reg:
    maxItems: 1

  enable-gpios:
    description: GPIO connected to the HWEN pin.
    maxItems: 1

required:
  - compatible
  - reg

unevaluatedProperties: false

examples:
  - |
    #include <dt-bindings/gpio/gpio.h>

    i2c {
        #address-cells = <1>;
        #size-cells = <0>;

        backlight@36 {
            compatible = "awinic,aw99703";
            reg = <0x36>;
            enable-gpios = <&pio 22 GPIO_ACTIVE_HIGH>;
        };
    };

...
