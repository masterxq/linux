%YAML 1.2
---
$id: http://devicetree.org/schemas/display/bridge/mediatek,mt6382.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: MediaTek MT6382 MIPI-DSI to MIPI-DSI bridge with DSC

maintainers:
  - masterxq <masterxq@users.noreply.github.com>

description: |
  The MT6382 receives uncompressed video from a SoC DSI host (up to four
  lanes), compresses it with DSC and sends it to a DSC panel through its own
  DSI transmitter. The chip is controlled through a MediaTek specific SPI
  slave protocol with 32-bit register addresses, sent LSB first. It also provides a 26 MHz
  clock output that some boards use for the NFC controller.

  Supplies are not described: the external rails of the chip are not
  documented and on the known boards they are always on.

allOf:
  - $ref: /schemas/spi/spi-peripheral-props.yaml#

properties:
  compatible:
    const: mediatek,mt6382

  reg:
    maxItems: 1

  spi-max-frequency:
    maximum: 55000000

  spi-lsb-first: true

  reset-gpios:
    maxItems: 1
    description: Active-low reset input (RESETB).

  clocks:
    maxItems: 1
    description: 26 MHz reference clock.

  "#clock-cells":
    const: 0
    description: The bridge can output its 26 MHz reference clock (e.g. for NFC).

  clock-output-names:
    maxItems: 1

  "#address-cells":
    const: 1

  "#size-cells":
    const: 0

  ports:
    $ref: /schemas/graph.yaml#/properties/ports

    properties:
      port@0:
        $ref: /schemas/graph.yaml#/$defs/port-base
        unevaluatedProperties: false
        description: DSI input from the SoC DSI host.

        properties:
          endpoint:
            $ref: /schemas/media/video-interfaces.yaml#
            unevaluatedProperties: false

            properties:
              data-lanes:
                minItems: 1
                maxItems: 4

      port@1:
        $ref: /schemas/graph.yaml#/properties/port
        description: DSI output to the panel.

patternProperties:
  "^panel@[0-3]$":
    type: object
    description:
      The panel on the DSI output of the bridge; the bridge is its DSI host
      (commands go through the transmitter command queue).

required:
  - compatible
  - reg

unevaluatedProperties: false

examples:
  - |
    #include <dt-bindings/gpio/gpio.h>

    spi {
        #address-cells = <1>;
        #size-cells = <0>;

        bridge@0 {
            compatible = "mediatek,mt6382";
            reg = <0>;
            spi-max-frequency = <55000000>;
            spi-lsb-first;
            reset-gpios = <&pio 32 GPIO_ACTIVE_LOW>;

            ports {
                #address-cells = <1>;
                #size-cells = <0>;

                port@0 {
                    reg = <0>;

                    bridge_in: endpoint {
                        remote-endpoint = <&dsi_out>;
                        data-lanes = <1 2 3 4>;
                    };
                };

                port@1 {
                    reg = <1>;

                    bridge_out: endpoint {
                        remote-endpoint = <&panel_in>;
                    };
                };
            };
        };
    };
