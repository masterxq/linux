%YAML 1.2
---
$id: http://devicetree.org/schemas/display/panel/tianma,ili7807s-lisbon.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Tianma ILI7807S 1080x2460 DSC panel (Motorola Moto G60s)

maintainers:
  - masterxq <masterxq@users.noreply.github.com>

description: |
  Video-mode MIPI-DSI panel with an Ilitek ILI7807S controller, 4 lanes,
  DSC 1.1 at 8 bpp. On the Motorola Moto G60s it is driven by the DSI
  transmitter of a MediaTek MT6382 bridge, which does the compression.
  The bias supply chip is not described; its enable lines are plain GPIOs
  here.

allOf:
  - $ref: panel-common.yaml#

properties:
  compatible:
    const: tianma,ili7807s-lisbon

  reg:
    maxItems: 1

  reset-gpios: true

  vddi-enable-gpios:
    maxItems: 1
    description: Enable of the LCD I/O LDO.

  enp-gpios:
    maxItems: 1
    description: Enable of the positive bias rail.

  enn-gpios:
    maxItems: 1
    description: Enable of the negative bias rail.

  backlight: true
  port: true

required:
  - compatible
  - reg
  - reset-gpios
  - port

additionalProperties: false

examples:
  - |
    #include <dt-bindings/gpio/gpio.h>

    dsi {
        #address-cells = <1>;
        #size-cells = <0>;

        panel@0 {
            compatible = "tianma,ili7807s-lisbon";
            reg = <0>;
            reset-gpios = <&pio 44 GPIO_ACTIVE_LOW>;
            vddi-enable-gpios = <&pio 88 GPIO_ACTIVE_HIGH>;
            enp-gpios = <&pio 23 GPIO_ACTIVE_HIGH>;
            enn-gpios = <&pio 202 GPIO_ACTIVE_HIGH>;
            backlight = <&backlight>;

            port {
                panel_in: endpoint {
                    remote-endpoint = <&bridge_out>;
                };
            };
        };
    };
