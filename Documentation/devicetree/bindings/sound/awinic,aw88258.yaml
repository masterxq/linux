%YAML 1.2
---
$id: http://devicetree.org/schemas/sound/awinic,aw88258.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Awinic AW88258 smart power amplifier (chip ID 0x1852)

maintainers:
  - masterxq <masterxq@users.noreply.github.com>

description:
  Class-D speaker amplifier with boost converter and I/V sense output, controlled over
  I2C and fed over I2S. The register profile is loaded as firmware.

allOf:
  - $ref: dai-common.yaml#

properties:
  compatible:
    const: awinic,aw88258

  reg:
    maxItems: 1

  '#sound-dai-cells':
    const: 0

  reset-gpios:
    maxItems: 1

  interrupts:
    maxItems: 1
    description: Interrupt output (not used by the driver).

  firmware-name:
    maxItems: 1
    description: Register profile, default "aw882xx_spk_reg.bin".

required:
  - compatible
  - reg
  - '#sound-dai-cells'
  - reset-gpios

unevaluatedProperties: false

examples:
  - |
    #include <dt-bindings/gpio/gpio.h>

    i2c {
        #address-cells = <1>;
        #size-cells = <0>;

        audio-codec@34 {
            compatible = "awinic,aw88258";
            reg = <0x34>;
            #sound-dai-cells = <0>;
            reset-gpios = <&pio 24 GPIO_ACTIVE_LOW>;
        };
    };
