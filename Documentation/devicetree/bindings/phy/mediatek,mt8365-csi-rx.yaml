%YAML 1.2
---
$id: http://devicetree.org/schemas/phy/mediatek,mt8365-csi-rx.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Mediatek Sensor Interface MIPI CSI CD-PHY

maintainers:
  - Julien Stephan <jstephan@baylibre.com>
  - Andy Hsieh <andy.hsieh@mediatek.com>

description:
  The SENINF CD-PHY is a set of CD-PHY connected to the SENINF CSI-2
  receivers. The number of PHYs depends on the SoC model.
  Depending on the SoC model, each PHYs can be either CD-PHY or D-PHY only
  capable.

properties:
  compatible:
    enum:
      - mediatek,mt6785-csi-rx
      - mediatek,mt8365-csi-rx

  reg:
    maxItems: 1
    description:
      Register window of one CSI port; on MT6785 the 0x4000 window with the
      analog halves A and B and the D-PHY top block.

  num-lanes:
    enum: [2, 3, 4]

  '#phy-cells':
    enum: [0, 1]
    description: |
      If the PHY doesn't support mode selection then #phy-cells must be 0 and
      PHY mode is described using phy-type property.
      If the PHY supports mode selection, then #phy-cells must be 1 and mode
      is set in the PHY cells. Supported modes are:
        - PHY_TYPE_DPHY
        - PHY_TYPE_CPHY
      See include/dt-bindings/phy/phy.h for constants.

  nvmem-cells:
    maxItems: 2
    description:
      MT6785 only, optional. Efuse words with the HS termination trimming of
      the A and B half of the port.

  nvmem-cell-names:
    items:
      - const: csi-a
      - const: csi-b

  mediatek,efuse-hsrt-shift:
    $ref: /schemas/types.yaml#/definitions/uint32-array
    items:
      - description: lowest code bit in the efuse word of the A half
        maximum: 17
      - description: lowest code bit in the efuse word of the B half
        maximum: 17
    description:
      MT6785 only, optional. Position of the three 5-bit HS termination
      codes in the efuse words, given as the bit of the lowest code (17 for
      codes in bits 31:17, the default, 2 for codes in bits 16:2).

  phy-type:
    description:
      If the PHY doesn't support mode selection then this set the operating mode.
      See include/dt-bindings/phy/phy.h for constants.
    const: 10
    $ref: /schemas/types.yaml#/definitions/uint32

required:
  - compatible
  - reg
  - num-lanes
  - '#phy-cells'

additionalProperties: false

examples:
  - |
    #include <dt-bindings/phy/phy.h>
    soc {
      #address-cells = <2>;
      #size-cells = <2>;

      csi0_rx: phy@11c10000 {
        compatible = "mediatek,mt8365-csi-rx";
        reg = <0 0x11c10000 0 0x2000>;
        num-lanes = <2>;
        #phy-cells = <1>;
      };

      csi1_rx: phy@11c12000 {
        compatible = "mediatek,mt8365-csi-rx";
        reg = <0 0x11c12000 0 0x2000>;
        phy-type = <PHY_TYPE_DPHY>;
        num-lanes = <2>;
        #phy-cells = <0>;
      };
    };
...
