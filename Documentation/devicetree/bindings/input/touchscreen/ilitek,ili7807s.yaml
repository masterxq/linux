%YAML 1.2
---
$id: http://devicetree.org/schemas/input/touchscreen/ilitek,ili7807s.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: ILITEK ILI7807S TDDI touchscreen controller (SPI)

maintainers:
  - Dmitry Torokhov <dmitry.torokhov@gmail.com>

description:
  Touch part of the ILITEK ILI7807S touch and display driver integration
  (TDDI) chip, connected over SPI. The touch controller has no flash; the
  host downloads its firmware into RAM after every touch reset. The display
  part of the chip has its own reset line, which is not described here.

allOf:
  - $ref: touchscreen.yaml#
  - $ref: /schemas/spi/spi-peripheral-props.yaml#

properties:
  compatible:
    const: ilitek,ili7807s

  reg:
    maxItems: 1

  interrupts:
    maxItems: 1

  reset-gpios:
    maxItems: 1
    description: Touch reset line (TP_RST), not the display reset.

  vdd-supply:
    description: Touch analog supply.

  vio-supply:
    description: Touch I/O supply.

  firmware-name:
    maxItems: 1
    description: Firmware file (ILITEK Intel HEX format) to download.

  panel:
    $ref: /schemas/types.yaml#/definitions/phandle
    description:
      Display panel of the same chip. A power cycle of the panel (bias, display
      reset) also resets the touch part, so the driver follows the panel state
      and downloads the firmware again after the panel is enabled.

  spi-max-frequency:
    maximum: 15000000

required:
  - compatible
  - reg
  - interrupts
  - reset-gpios

unevaluatedProperties: false

examples:
  - |
    #include <dt-bindings/gpio/gpio.h>
    #include <dt-bindings/interrupt-controller/irq.h>

    spi {
        #address-cells = <1>;
        #size-cells = <0>;

        touchscreen@0 {
            compatible = "ilitek,ili7807s";
            reg = <0>;
            spi-max-frequency = <10000000>;
            interrupts-extended = <&pio 1 IRQ_TYPE_EDGE_FALLING>;
            reset-gpios = <&pio 2 GPIO_ACTIVE_LOW>;
            firmware-name = "ilitek/ili7807s.hex";
            touchscreen-size-x = <1080>;
            touchscreen-size-y = <2460>;
        };
    };
